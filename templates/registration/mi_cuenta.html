{% extends "base/base.html" %}
{% block titulo %}Mi cuenta{% endblock %}
{% block contenido %}
<div class="encabezado"><div><h1>Mi cuenta</h1><p class="encabezado__sub">{{ user.nombre_completo }}, usuario {{ user.username }}</p></div>
<div class="encabezado__acciones"><a class="boton boton--secundario" href="{% url 'cambiar_clave' %}">Cambiar contraseña</a></div></div>
<form method="post" class="panel formulario" novalidate><div class="panel__cuerpo">
{% csrf_token %}{% include "base/_form.html" %}
<div class="formulario__pie"><button class="boton" type="submit">Guardar mis datos</button></div></div></form>
{% endblock %}
