# Despliegue sin costo: servicio web gratuito de Render + base de datos gratuita de Neon.
# En Render: New > Blueprint > elegir este repositorio. Pedirá el valor de DATABASE_URL:
# pegue la cadena de conexión que entrega Neon (neon.com), que empieza por postgresql://
services:
  - type: web
    name: pizarra
    runtime: docker
    plan: free
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
