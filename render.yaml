# Despliegue en Render: Nuevo > Blueprint > elegir este repositorio.
databases:
  - name: pizarra-db
    plan: free
services:
  - type: web
    name: pizarra
    runtime: docker
    plan: free
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pizarra-db
          property: connectionString
